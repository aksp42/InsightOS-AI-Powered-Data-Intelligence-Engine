# TEMPORARY verification workflow for the Phase 1 SYSTEMROOT fix. Do not merge into main.
name: verify-phase1
on:
  push:
    branches: ["verify/**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python version
        run: python --version
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip list
      - name: Targeted test
        run: pytest "tests/test_package.py::test_python_m_insightos_runs" -v
      - name: Full pytest
        run: pytest -q
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy
