[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "insightos"
dynamic = ["version"]
description = "InsightOS - AI-assisted, evidence-driven data preprocessing and consistency improvement."
readme = "README.md"
requires-python = ">=3.11"
# Phase 1 runtime dependencies only. Later phases add theirs when they need them.
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
insightos = "insightos.cli:main"

[tool.hatch.version]
path = "src/insightos/__init__.py"

# Only the application package is shipped. `evaluation/` is repository-level
# dev tooling (benchmarks, corruption injection) and is run from the repo root.
[tool.hatch.build.targets.wheel]
packages = ["src/insightos"]

[tool.hatch.build.targets.sdist]
include = ["src/insightos", "evaluation", "tests", "config", "README.md", ".env.example"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["insightos"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]
# Explicit allow-list so tooling never wanders into sibling directories.
include = ["src/**/*.py", "tests/**/*.py", "evaluation/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/insightos", "evaluation", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
